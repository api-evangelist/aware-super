summary: Aware Super publishes no developer API or integrations directory. The one integration it documents is its
  placement on SuperAPI's employee-onboarding super-selection panel, where SuperAPI passes member details to Aware
  Super to verify an existing account or create a new one. The service-partners page lists outsourced business providers
  (TAL Life as insurer and a table of investment managers). These are financial-services relationships, not software
  or API integrations, so they are not recorded as edges.
